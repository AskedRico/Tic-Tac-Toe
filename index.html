<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <h2 style="text-align: center; margin-bottom: 20px;" id="status"></h2>

    <div id="box">
        <div index="0" class="cella"></div>
        <div index="1"  class="cella"></div>
        <div index="2"  class="cella"></div>
        <div index="3"  class="cella"></div>
        <div index="4"  class="cella"></div>
        <div index="5"  class="cella"></div>
        <div index="6"  class="cella"></div>
        <div index="7"  class="cella"></div>
        <div index="8"  class="cella"></div>
    </div>
    <div id="bottom_box">
        
        <button id="ujra">Újra</button>
    </div>


    <script src="script.js"></script>
</body>
</html>
